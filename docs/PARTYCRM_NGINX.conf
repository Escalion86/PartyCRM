# Standalone nginx config for PartyCRM.
#
# Target path on server:
# /etc/nginx/sites-available/partycrm
#
# Next.js process must listen on 127.0.0.1:3007.

upstream partycrm_app {
    server 127.0.0.1:3007;
    keepalive 64;
}

server {
    listen 80;
    server_name partycrm.ru;

    return 301 https://partycrm.ru$request_uri;
}

server {
    listen 80;
    server_name www.partycrm.ru;

    return 301 https://partycrm.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name www.partycrm.ru;

    ssl_certificate /etc/letsencrypt/live/partycrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partycrm.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://partycrm.ru$request_uri;
}

server {
    listen 443 ssl;
    server_name partycrm.ru;

    ssl_certificate /etc/letsencrypt/live/partycrm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partycrm.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    access_log /var/log/nginx/partycrm.access.log;
    error_log  /var/log/nginx/partycrm.error.log;

    location / {
        proxy_pass http://partycrm_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location /_next/static/ {
        proxy_pass http://partycrm_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
