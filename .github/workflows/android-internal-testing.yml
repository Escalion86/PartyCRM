name: Android Internal Testing

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Verify app configuration
        run: |
          echo "=== app.json ==="
          cat app.json | jq '.expo.name'
          cat app.json | jq '.expo.android.package'
          cat app.json | jq '.expo.version'
          echo "=== eas.json ==="
          cat eas.json | jq '.build.internal'

      - name: Build Android AAB
        run: eas build --platform android --profile internal --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_BASE_URL: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}

      - name: Upload to Google Play Internal Testing
        if: success()
        run: eas submit --platform android --profile internal --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "## Android Internal Testing Build" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
